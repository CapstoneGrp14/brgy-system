<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barangay 591 e-Services</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/brgy591-logo.png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/brgy591-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Installable so Android/iOS can deliver push to a home-screen launch.
         iOS is the strict one: Safari delivers web push ONLY to a PWA launched
         from the Home Screen (iOS 16.4+), never to an ordinary browser tab —
         which is what display:standalone and the apple-touch-icon above serve.
         No "maskable" icon is declared on purpose: the logo has no safe-area
         padding, and Android crops a maskable icon into an adaptive shape,
         which would clip the seal. Without the claim it is letterboxed on a
         background instead. Add a padded 512x512 variant to reinstate it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1E3A5F" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
