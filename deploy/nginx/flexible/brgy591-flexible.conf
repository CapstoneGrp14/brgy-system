# ── Cloudflare "Flexible" SSL — origin serves plain HTTP on :80 ──────────────
# Browser <-https-> Cloudflare <-HTTP-> this box. No certs needed here.
#
# All three hostnames in one file: install with a single symlink.
#   sudo cp deploy/nginx/flexible/brgy591-flexible.conf /etc/nginx/sites-available/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/brgy591-flexible.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl restart nginx
#
# Cloudflare SSL/TLS mode MUST be "Flexible". With Full/Full(strict) Cloudflare
# speaks HTTPS to :443 here, finds nothing listening, and returns 521.
#
# NOTE: there is deliberately NO http->https redirect. Cloudflare always
# arrives over HTTP, so redirecting would loop forever (ERR_TOO_MANY_REDIRECTS).

# Log the visitor's real IP instead of Cloudflare's edge node.
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

upstream brgy_api { server 127.0.0.1:3000; keepalive 32; }

# ── brgy591.site — SPA + API on one origin ──────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name brgy591.site www.brgy591.site;

    client_max_body_size 25m;

    root /var/www/brgy591/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html { add_header Cache-Control "no-store"; }

    location / { try_files $uri $uri/ /index.html; }

    location /api/ {
        proxy_pass         http://brgy_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare tells us the browser's real scheme; pass it on so the app
        # knows the request was HTTPS end-user-side.
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass         http://brgy_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}

# ── api.brgy591.site — direct API access (Postman / debugging) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.brgy591.site;

    client_max_body_size 25m;

    location / {
        proxy_pass         http://brgy_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass         http://brgy_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }
}

# ── minio.brgy591.site — object storage ─────────────────────────────────────
# $host must pass through untouched: SigV4 signs the Host header, and the API
# signs URLs for "minio.brgy591.site". Rewrite it and every file 403s.
server {
    listen 80;
    listen [::]:80;
    server_name minio.brgy591.site;

    client_max_body_size      0;
    proxy_buffering           off;
    proxy_request_buffering   off;
    chunked_transfer_encoding off;
    ignore_invalid_headers    off;

    location / {
        proxy_pass         http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
    }
}
