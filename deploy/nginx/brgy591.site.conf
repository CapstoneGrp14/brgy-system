# ── brgy591.site — UI + API on ONE origin ────────────────────────────────────
# The SPA calls the API with relative paths ('/api/v1', '/socket.io') and sends
# no withCredentials, so the API MUST answer on this same host or the httpOnly
# refresh cookie is never sent and sessions die on every reload.

upstream brgy_api { server 127.0.0.1:3000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name brgy591.site www.brgy591.site;
    return 301 https://brgy591.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.brgy591.site;

    ssl_certificate     /etc/ssl/cloudflare/brgy591.site.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brgy591.site.key;

    return 301 https://brgy591.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name brgy591.site;

    ssl_certificate     /etc/ssl/cloudflare/brgy591.site.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brgy591.site.key;

    # Announcement photos are capped at 5 MB and CSV import at 2 MB server-side.
    client_max_body_size 25m;

    # Built SPA:  npm run build -w @brgy/web  →  apps/web/dist
    root /var/www/brgy591/dist;
    index index.html;

    # Hashed bundles are immutable; index.html must never be cached or users
    # keep booting an old build that points at deleted asset hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # React Router owns the client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://brgy_api;      # no trailing slash: keeps /api/v1/...
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.IO: long-lived upgrade, must not inherit the 60s default timeout.
    location /socket.io/ {
        proxy_pass         http://brgy_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
