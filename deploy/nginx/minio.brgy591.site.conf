# ── minio.brgy591.site — object storage ──────────────────────────────────────
# Browsers open presigned URLs here directly (banner photos, verification docs,
# generated PDFs). The SigV4 signature covers the Host header, so this vhost
# must pass $host through UNCHANGED and must not rewrite the URI or strip query
# args — any of those turn into a 403 SignatureDoesNotMatch.

server {
    listen 80;
    listen [::]:80;
    server_name minio.brgy591.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name minio.brgy591.site;

    ssl_certificate     /etc/ssl/cloudflare/brgy591.site.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brgy591.site.key;

    # Let MinIO enforce object size; nginx should not buffer large uploads.
    client_max_body_size        0;
    proxy_buffering             off;
    proxy_request_buffering     off;
    chunked_transfer_encoding   off;
    ignore_invalid_headers      off;   # MinIO uses x-amz-* headers

    location / {
        proxy_pass         http://127.0.0.1:9002;   # compose maps 9002 -> minio:9000
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;   # MUST match the signed host
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
    }
}

# Admin console (127.0.0.1:9003) is intentionally NOT exposed. Reach it over an
# SSH tunnel instead:  ssh -L 9003:127.0.0.1:9003 ec2-user@<ip>
