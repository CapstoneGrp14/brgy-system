# ── api.brgy591.site — direct API access ─────────────────────────────────────
# Optional. The browser app does NOT use this host (it calls brgy591.site/api),
# so this exists for Postman, integrations and debugging. Cookie-based refresh
# will not work from a browser page served on brgy591.site, because the client
# never sets withCredentials — bearer-token calls work fine.

server {
    listen 80;
    listen [::]:80;
    server_name api.brgy591.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.brgy591.site;

    ssl_certificate     /etc/ssl/cloudflare/brgy591.site.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brgy591.site.key;

    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
