name: brgy-system

x-app-base: &app-base
  image: node:22-alpine
  working_dir: /repo
  volumes:
    - .:/repo
    - node_modules:/repo/node_modules
  environment: &app-env
    NODE_ENV: development
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_USER: brgy
    DB_PASSWORD: brgy_dev_password
    DB_NAME: brgy591
    REDIS_URL: redis://redis:6379
    RABBITMQ_URL: amqp://brgy:brgy_dev_password@rabbitmq:5672
    MINIO_ENDPOINT: minio
    MINIO_PORT: "9000"
    # Browser-facing address for presigned links (host port mapping of minio)
    MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
    MINIO_PUBLIC_PORT: "9002"
    MINIO_USE_SSL: "false"
    MINIO_ACCESS_KEY: brgy-minio
    MINIO_SECRET_KEY: brgy_dev_password
    # Mail: MailHog by default; set RESEND_API_KEY in .env to switch every
    # outbound email to Resend (smtp.resend.com) — no other change needed.
    SMTP_HOST: mailhog
    SMTP_PORT: "1025"
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    MAIL_FROM: ${MAIL_FROM:-Barangay 591 <no-reply@brgy591.local>}
    # 591 Assistant LLM (Ollama + Gemma 3). Empty OLLAMA_URL → rule-based bot.
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    WEB_URL: ${WEB_URL:-http://localhost:5173}
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
    # Emailed 6-digit code on sign-in; codes land in MailHog (http://localhost:8025).
    AUTH_2FA_ENABLED: ${AUTH_2FA_ENABLED:-true}
    GOTENBERG_URL: http://gotenberg:3000

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: brgy591
      MYSQL_USER: brgy
      MYSQL_PASSWORD: brgy_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379" # host 6380 to avoid clashing with other local Redis containers
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: brgy-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: brgy
      RABBITMQ_DEFAULT_PASS: brgy_dev_password
    ports:
      - "5673:5672" # host 5673 to avoid clashes with other local projects
      - "15673:15672" # management UI → http://localhost:15673
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # MinIO's public images were removed from Docker Hub, so the object store is
  # SeaweedFS's S3 gateway instead. Service name and MINIO_* env vars are kept:
  # it speaks the same S3 API with SigV4, so presigned links sign identically.
  minio:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - minio_data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "9002:9000" # S3 API, host 9002 to avoid clashes with other local projects
      - "9003:8888" # filer UI → http://localhost:9003
    healthcheck:
      # S3 port only; 127.0.0.1 not "localhost" — seaweed binds IPv4 and the
      # image resolves localhost to [::1], which refuses the connection.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot bucket creation. Uses the AWS CLI rather than `mc` so it needs no
  # node_modules (the api installs those) and no MinIO-only tooling.
  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: brgy-minio
      AWS_SECRET_ACCESS_KEY: brgy_dev_password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for b in uploads documents; do
        aws --endpoint-url http://minio:9000 s3 mb s3://$$b 2>/dev/null ||
        echo \"bucket $$b already exists\";
      done &&
      aws --endpoint-url http://minio:9000 s3 ls &&
      echo 'S3 buckets ready'
      "

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: pulls the Gemma 3 model into the shared volume (first run downloads it).
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      /bin/sh -c "ollama pull ${OLLAMA_MODEL:-gemma3:4b} && echo 'Gemma model ready'"

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3010:3000" # docx → pdf conversion API
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    <<: *app-base
    command: sh -c "npm install && npm run build -w @brgy/shared && npm run migration:run -w @brgy/api && npm run start:dev -w @brgy/api"
    ports:
      - "3000:3000"
    environment:
      <<: *app-env
      API_PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s # first boot runs npm install + migrations
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # worker/web skip npm install + shared build: api runs both before its
  # healthcheck passes, and concurrent installs in the shared volume collide.
  worker:
    <<: *app-base
    command: npm run start:worker:dev -w @brgy/api
    depends_on:
      api:
        condition: service_healthy # deps installed + shared built + migrations done

  web:
    <<: *app-base
    command: npm run dev -w @brgy/web -- --host
    ports:
      - "5173:5173"
    environment:
      <<: *app-env
      VITE_API_PROXY: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  minio_data:
  rabbitmq_data:
  ollama_models:
  node_modules:
